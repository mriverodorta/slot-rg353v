[global]
server string = Slot
netbios name = SLOT
workgroup = WORKGROUP
server min protocol = SMB2_10
server max protocol = SMB3_11
server signing = auto
map to guest = Bad User
guest account = root
max connections = 128
max active sessions = 1024
max open files = 10000
smb2 max read = 64KB
smb2 max write = 64KB
smb2 max trans = 64KB
smb2 leases = no
kerberos support = no

[Slot]
path = /storage/slotcontent
read only = no
guest ok = yes
force user = root
browseable = yes
store dos attributes = no
vfs objects =
oplocks = no
